<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - UMak CGCS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Reset Password</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Please enter and confirm your new account password.</p>
    </div>

    <form id="resetPasswordForm" onsubmit="handleResetSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Create New Password:</label>
        <div class="relative flex items-center">
          <input type="password" id="createPassword" required minlength="8" placeholder="Enter at least 8 characters" class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-amber-500 outline-none text-sm">
          <button type="button" onclick="togglePasswordVisibility('createPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-amber-500 transition-colors focus:outline-none bg-transparent border-0 cursor-pointer flex items-center justify-center" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 hover:text-amber-500 transition-colors pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Confirm New Password:</label>
        <div class="relative flex items-center">
          <input type="password" id="confirmPassword" required minlength="8" placeholder="Re-enter new password" class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-amber-500 outline-none text-sm">
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-amber-500 transition-colors focus:outline-none bg-transparent border-0 cursor-pointer flex items-center justify-center" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 hover:text-amber-500 transition-colors pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div id="statusAlert" class="text-sm font-medium hidden"></div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg transition-all shadow-md mt-2">
        Update Password
      </button>

      <div class="text-center mt-4">
        <a href="/" class="text-xs text-slate-500 hover:text-amber-500 transition-colors">
          <i class="fa-solid fa-arrow-left mr-1"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btnElement) {
      const input = document.getElementById(inputId);
      if (!input) return;

      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      const eyeOpenIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 hover:text-amber-500 transition-colors pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      `;

      const eyeSlashIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-500 transition-colors pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        </svg>
      `;

      const btn = btnElement || (window.event && window.event.target ? window.event.target.closest('button') : null);
      if (btn) {
        btn.innerHTML = isPassword ? eyeSlashIcon : eyeOpenIcon;
        btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      }
    }
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || params.get('reset_token');
    const email = params.get('email');

    if (!token || !email) {
      const alert = document.getElementById('statusAlert');
      alert.textContent = 'Invalid or expired password reset link.';
      alert.className = 'text-sm font-medium text-red-500 block';
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const newPassword = document.getElementById('createPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertBox = document.getElementById('statusAlert');

      if (newPassword !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.className = 'text-sm font-medium text-red-500 block';
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.textContent = 'Password reset successfully! Redirecting to login...';
          alertBox.className = 'text-sm font-medium text-emerald-600 block';
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          alertBox.textContent = data.error || 'Failed to reset password.';
          alertBox.className = 'text-sm font-medium text-red-500 block';
        }
      } catch (err) {
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.className = 'text-sm font-medium text-red-500 block';
      }
    }
  </script>
</body>
</html>
